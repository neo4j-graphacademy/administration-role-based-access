services:
  neo4j:
    image: neo4j:enterprise
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j-password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - "./data:/data"
    healthcheck:
      test:
        - CMD
        - cypher-shell
        - -u
        - neo4j
        - -p
        - neo4j-password
        - RETURN 1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
